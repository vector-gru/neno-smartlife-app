<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <!-- Doodle: Request & Delivery — shopping cart, chat bubbles, delivery box, checkmark -->

  <radialGradient id="g3" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#B5D317" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="360" height="300" fill="url(#g3)"/>

  <!-- Shopping cart center-left -->
  <g transform="translate(50, 80)">
    <!-- Cart body -->
    <path d="M10 20 L22 60 L78 60 L90 20 Z" fill="#B5D317" opacity="0.1" stroke="#B5D317" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Cart handle -->
    <path d="M0 12 L10 12 L10 20" fill="none" stroke="#B5D317" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="32" cy="68" r="8" fill="none" stroke="#B5D317" stroke-width="2"/>
    <circle cx="32" cy="68" r="3" fill="#B5D317" opacity="0.5"/>
    <circle cx="68" cy="68" r="8" fill="none" stroke="#B5D317" stroke-width="2"/>
    <circle cx="68" cy="68" r="3" fill="#B5D317" opacity="0.5"/>
    <!-- Items in cart -->
    <rect x="22" y="28" width="22" height="22" rx="3" fill="#B5D317" opacity="0.2" stroke="#B5D317" stroke-width="1"/>
    <rect x="46" y="28" width="22" height="22" rx="3" fill="#B5D317" opacity="0.2" stroke="#B5D317" stroke-width="1"/>
    <!-- Cart badge -->
    <circle cx="80" cy="8" r="10" fill="#B5D317"/>
    <text x="80" y="13" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="#0A0A0A">3</text>
  </g>

  <!-- Chat bubbles top-right -->
  <g transform="translate(200, 50)">
    <!-- Business bubble -->
    <rect x="0" y="0" width="120" height="40" rx="12" fill="#B5D317" opacity="0.15" stroke="#B5D317" stroke-width="1.5"/>
    <polygon points="12,40 6,52 26,40" fill="#B5D317" opacity="0.15"/>
    <polygon points="12,40 6,52 26,40" fill="none" stroke="#B5D317" stroke-width="1.5"/>
    <line x1="12" y1="14" x2="100" y2="14" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
    <line x1="12" y1="24" x2="80" y2="24" stroke="#B5D317" stroke-width="1.5" opacity="0.4"/>
    <!-- Check mark inside bubble -->
    <polyline points="86,10 92,16 104,4" stroke="#B5D317" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Customer reply bubble -->
    <rect x="20" y="62" width="100" height="34" rx="12" fill="#B5D317" opacity="0.1" stroke="#B5D317" stroke-width="1.5"/>
    <polygon points="108,62 114,50 94,62" fill="#B5D317" opacity="0.1"/>
    <polygon points="108,62 114,50 94,62" fill="none" stroke="#B5D317" stroke-width="1.5"/>
    <line x1="32" y1="76" x2="108" y2="76" stroke="#B5D317" stroke-width="1.5" opacity="0.4"/>
    <line x1="32" y1="86" x2="90" y2="86" stroke="#B5D317" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- Delivery box bottom-center -->
  <g transform="translate(130, 185)">
    <!-- Box body -->
    <rect x="0" y="20" width="100" height="70" rx="6" fill="#B5D317" opacity="0.1" stroke="#B5D317" stroke-width="2"/>
    <!-- Box top flap -->
    <path d="M0 20 L10 4 L90 4 L100 20" fill="#B5D317" opacity="0.12" stroke="#B5D317" stroke-width="2"/>
    <!-- Center crease -->
    <line x1="50" y1="4" x2="50" y2="20" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
    <!-- Tape strip -->
    <rect x="30" y="18" width="40" height="8" rx="3" fill="#B5D317" opacity="0.3"/>
    <!-- Side seam line -->
    <line x1="20" y1="20" x2="20" y2="90" stroke="#B5D317" stroke-width="1" opacity="0.3"/>
    <line x1="80" y1="20" x2="80" y2="90" stroke="#B5D317" stroke-width="1" opacity="0.3"/>
    <!-- Big checkmark on box -->
    <polyline points="28,58 46,72 72,44" stroke="#B5D317" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Flow arrows: cart → chat → box -->
  <path d="M152 138 Q175 130 200 148" fill="none" stroke="#B5D317" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.45"/>
  <polygon points="198,142 206,150 196,154" fill="#B5D317" opacity="0.45"/>

  <path d="M250 210 Q245 230 230 240" fill="none" stroke="#B5D317" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.45"/>
  <polygon points="224,242 230,252 236,240" fill="#B5D317" opacity="0.45"/>

  <!-- Stars/sparkles -->
  <circle cx="30" cy="60" r="2.5" fill="#B5D317" opacity="0.4"/>
  <circle cx="340" cy="80" r="2" fill="#B5D317" opacity="0.35"/>
  <circle cx="350" cy="200" r="2.5" fill="#B5D317" opacity="0.3"/>
  <circle cx="20" cy="250" r="2" fill="#B5D317" opacity="0.3"/>

  <!-- FCFA text floating -->
  <rect x="10" y="200" width="76" height="22" rx="5" fill="#B5D317" opacity="0.1" stroke="#B5D317" stroke-width="1"/>
  <text x="48" y="215" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" fill="#B5D317" opacity="0.7">Pay Offline</text>
</svg>
