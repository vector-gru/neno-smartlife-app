<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Dark background -->
  <rect width="400" height="500" fill="#0A0A0A"/>

  <!-- Radial glow behind logo -->
  <radialGradient id="glow" cx="50%" cy="42%" r="40%">
    <stop offset="0%" stop-color="#B5D317" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- Circuit grid faint background -->
  <g opacity="0.07" stroke="#B5D317" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <!-- Vertical lines -->
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <!-- Grid nodes -->
    <circle cx="80" cy="80" r="3" fill="#B5D317"/>
    <circle cx="160" cy="80" r="3" fill="#B5D317"/>
    <circle cx="240" cy="80" r="3" fill="#B5D317"/>
    <circle cx="320" cy="80" r="3" fill="#B5D317"/>
    <circle cx="80" cy="160" r="3" fill="#B5D317"/>
    <circle cx="320" cy="160" r="3" fill="#B5D317"/>
    <circle cx="80" cy="320" r="3" fill="#B5D317"/>
    <circle cx="320" cy="320" r="3" fill="#B5D317"/>
    <circle cx="80" cy="400" r="3" fill="#B5D317"/>
    <circle cx="160" cy="400" r="3" fill="#B5D317"/>
    <circle cx="240" cy="400" r="3" fill="#B5D317"/>
    <circle cx="320" cy="400" r="3" fill="#B5D317"/>
  </g>

  <!-- Decorative circuit nodes -->
  <g fill="none" stroke="#B5D317" stroke-width="2">
    <!-- Top left node -->
    <circle cx="60" cy="140" r="8" opacity="0.5"/>
    <circle cx="60" cy="140" r="3" fill="#B5D317" opacity="0.5"/>
    <line x1="60" y1="132" x2="60" y2="120" opacity="0.4"/>
    <line x1="68" y1="140" x2="90" y2="140" opacity="0.4"/>

    <!-- Top right node -->
    <circle cx="340" cy="140" r="8" opacity="0.5"/>
    <circle cx="340" cy="140" r="3" fill="#B5D317" opacity="0.5"/>
    <line x1="340" y1="132" x2="340" y2="120" opacity="0.4"/>
    <line x1="332" y1="140" x2="310" y2="140" opacity="0.4"/>

    <!-- Bottom left node -->
    <circle cx="60" cy="370" r="8" opacity="0.4"/>
    <circle cx="60" cy="370" r="3" fill="#B5D317" opacity="0.4"/>
    <line x1="68" y1="370" x2="90" y2="370" opacity="0.3"/>

    <!-- Bottom right node -->
    <circle cx="340" cy="370" r="8" opacity="0.4"/>
    <circle cx="340" cy="370" r="3" fill="#B5D317" opacity="0.4"/>
    <line x1="332" y1="370" x2="310" y2="370" opacity="0.3"/>
  </g>

  <!-- Small floating dots -->
  <circle cx="30" cy="200" r="2" fill="#B5D317" opacity="0.3"/>
  <circle cx="370" cy="200" r="2" fill="#B5D317" opacity="0.3"/>
  <circle cx="30" cy="300" r="2" fill="#B5D317" opacity="0.25"/>
  <circle cx="370" cy="300" r="2" fill="#B5D317" opacity="0.25"/>
  <circle cx="200" cy="80" r="3" fill="#B5D317" opacity="0.2"/>
  <circle cx="200" cy="420" r="3" fill="#B5D317" opacity="0.2"/>
</svg>
