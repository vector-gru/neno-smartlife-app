<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <!-- Doodle: Save Favourites — heart, bookmark, comparison arrows -->

  <radialGradient id="g2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#B5D317" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="360" height="300" fill="url(#g2)"/>

  <!-- Large heart center -->
  <path d="M180 220 L100 148 Q80 118 110 100 Q140 82 160 110 L180 130 L200 110 Q220 82 250 100 Q280 118 260 148 Z"
        fill="#B5D317" opacity="0.12" stroke="#B5D317" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner heart glow -->
  <path d="M180 205 L118 155 Q105 135 124 122 Q144 109 160 128 L180 148 L200 128 Q216 109 236 122 Q255 135 242 155 Z"
        fill="#B5D317" opacity="0.08"/>

  <!-- Product card left -->
  <rect x="20" y="80" width="100" height="130" rx="10" fill="none" stroke="#B5D317" stroke-width="1.8" opacity="0.6"/>
  <rect x="30" y="90" width="80" height="60" rx="6" fill="#B5D317" opacity="0.08"/>
  <!-- Phone icon in card -->
  <rect x="52" y="100" width="36" height="40" rx="5" fill="none" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="104" x2="80" y2="104" stroke="#B5D317" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="135" x2="80" y2="135" stroke="#B5D317" stroke-width="1.5" opacity="0.4"/>
  <!-- Price line -->
  <line x1="30" y1="160" x2="110" y2="160" stroke="#B5D317" stroke-width="1.5" opacity="0.4"/>
  <line x1="30" y1="168" x2="90" y2="168" stroke="#B5D317" stroke-width="1.2" opacity="0.3"/>
  <!-- Star rating -->
  <text x="34" y="182" font-family="Arial" font-size="12" fill="#B5D317" opacity="0.6">★★★★★</text>
  <!-- Bookmark badge -->
  <path d="M104 84 L116 84 L116 100 L110 95 L104 100 Z" fill="#B5D317" opacity="0.7"/>

  <!-- Product card right -->
  <rect x="240" y="80" width="100" height="130" rx="10" fill="none" stroke="#B5D317" stroke-width="1.8" opacity="0.6"/>
  <rect x="250" y="90" width="80" height="60" rx="6" fill="#B5D317" opacity="0.08"/>
  <!-- Headphone icon in card -->
  <path d="M270 120 Q270 105 290 105 Q310 105 310 120" fill="none" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
  <rect x="265" y="118" width="10" height="16" rx="5" fill="none" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
  <rect x="305" y="118" width="10" height="16" rx="5" fill="none" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
  <!-- Price line -->
  <line x1="250" y1="160" x2="330" y2="160" stroke="#B5D317" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="168" x2="310" y2="168" stroke="#B5D317" stroke-width="1.2" opacity="0.3"/>
  <text x="254" y="182" font-family="Arial" font-size="12" fill="#B5D317" opacity="0.6">★★★★☆</text>
  <!-- Heart badge -->
  <path d="M320 84 Q318 80 322 78 Q326 76 328 80 Q330 76 334 78 Q338 80 336 84 L328 92 Z"
        fill="#B5D317" opacity="0.7"/>

  <!-- Compare arrows between cards -->
  <line x1="128" y1="145" x2="234" y2="145" stroke="#B5D317" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <polygon points="230,140 240,145 230,150" fill="#B5D317" opacity="0.5"/>
  <polygon points="132,140 122,145 132,150" fill="#B5D317" opacity="0.5"/>
  <text x="181" y="140" font-family="Arial" font-size="9" text-anchor="middle" fill="#B5D317" opacity="0.6">vs</text>

  <!-- Share icon bottom center -->
  <circle cx="180" cy="260" r="6" fill="none" stroke="#B5D317" stroke-width="2" opacity="0.5"/>
  <circle cx="156" cy="272" r="6" fill="none" stroke="#B5D317" stroke-width="2" opacity="0.5"/>
  <circle cx="204" cy="272" r="6" fill="none" stroke="#B5D317" stroke-width="2" opacity="0.5"/>
  <line x1="174" y1="264" x2="162" y2="270" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>
  <line x1="186" y1="264" x2="198" y2="270" stroke="#B5D317" stroke-width="1.5" opacity="0.5"/>

  <!-- Sparkles -->
  <circle cx="60" cy="58" r="2.5" fill="#B5D317" opacity="0.4"/>
  <circle cx="296" cy="52" r="2" fill="#B5D317" opacity="0.35"/>
  <circle cx="180" cy="46" r="3" fill="#B5D317" opacity="0.3"/>
  <circle cx="340" cy="220" r="2" fill="#B5D317" opacity="0.3"/>
  <circle cx="20" cy="240" r="2" fill="#B5D317" opacity="0.25"/>
</svg>
